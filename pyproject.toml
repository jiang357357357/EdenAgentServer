[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mon-agent-server"
version = "0.1.0"
description = "Python MonAgent local server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mon-agent-core",
    "pyzmq>=26",
]

[tool.uv]
managed = true

[tool.uv.sources]
mon-agent-core = { path = "../AgentCore", editable = true }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
