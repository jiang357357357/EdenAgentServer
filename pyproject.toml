build-backend = "setuptools.build_meta"

[project]
name = "mon-agent-server"
version = "0.1.0"
description = "Python MonAgent local server"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
