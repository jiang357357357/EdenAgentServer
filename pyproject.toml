[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mon-agent-server"
version = "1.7.5"
description = "Python MonAgent local server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mon-agent-core",
    "pyzmq>=26",
    "rich>=13",
    "PyYAML>=6.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
    "httpx>=0.28,<1",
    "python-chess>=1.999,<2",
]

[tool.uv]
managed = true

[tool.uv.sources]
mon-agent-core = { path = "../AgentCore", editable = true }

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mon_agent_server.connectors.openttd_bridge" = ["game/*.nut", "ai/*.nut"]
"mon_agent_server.skills" = ["builtin/*/SKILL.md"]
